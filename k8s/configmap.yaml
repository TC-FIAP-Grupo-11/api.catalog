apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: default
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:80"
  Messaging__RabbitMQ__Host: "rabbitmq-service"
  Messaging__RabbitMQ__Username: "guest"
  Messaging__RabbitMQ__Password: "guest"
  USERS_API_URL: "http://users-api-service:80"
  USERS_API_TIMEOUT: "30"
  SWAGGER_BASE_PATH: "/catalog"
  NEW_RELIC_APP_NAME: "fcg-catalog-api"
